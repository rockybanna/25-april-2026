<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Delivery Panel</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; background:#f5f5f5; margin:0; }
    .card { background:white; margin:10px; padding:15px; border-radius:10px; }
    button { padding:10px; margin-top:10px; width:100%; }
  </style>

</head>

<body>

<h2 style="padding:10px">🛵 Delivery Panel</h2>
<div id="list"></div>

<script>
const { createClient } = window.supabase;

const sb = createClient(
  "https://rjkkasswxuzhaegocbim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2thc3N3eHV6aGFlZ29jYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE3OTIsImV4cCI6MjA5MjY3Nzc5Mn0.l08t44YE-ElP9pSXV6s1Z6qgktaNz8jboEjJ0cK_BCU"
);

// 🔴 TEMP DP ID (later login se aayega)
const DP_ID = "8de8bb69-588f-4ebc-89a3-96b7963e8864";

async function loadOrders() {

  const { data } = await sb
    .from('orders')
    .select('*')
    .eq('status', 'READY')   // only ready orders
    .is('dp_id', null);      // not assigned

  const container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(o => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <p><b>Order ID:</b> ${o.id}</p>
      <p><b>Item:</b> ${o.item_name}</p>

      <button onclick="acceptDelivery('${o.id}')">
        Accept Delivery
      </button>
    `;

    container.appendChild(div);
  });
}

async function acceptDelivery(orderId) {

  await sb.from('orders')
    .update({
      dp_id: DP_ID,
      status: 'PICKED'
    })
    .eq('id', orderId);

  alert("Order Picked");
  loadMyOrders();
}

// 🔥 AFTER PICKUP VIEW
async function loadMyOrders() {

  const { data } = await sb
    .from('orders')
    .select('*')
    .eq('dp_id', DP_ID)
    .in('status', ['PICKED', 'OUT_FOR_DELIVERY']);

  const container = document.getElementById("list");
  container.innerHTML = "<h3 style='padding:10px'>My Deliveries</h3>";

  data.forEach(o => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <p><b>Order ID:</b> ${o.id}</p>
      <p><b>Item:</b> ${o.item_name}</p>

      <p><b>Customer:</b> ${o.customer_name || 'Test User'}</p>
      <p><b>Phone:</b> ${o.customer_phone || '9999999999'}</p>
      <p><b>Address:</b> ${o.customer_address || 'Test Address'}</p>

      <button onclick="markDelivered('${o.id}')">
        Mark Delivered
      </button>
    `;

    container.appendChild(div);
  });
}

async function markDelivered(orderId) {

  await sb.from('orders')
    .update({
      status: 'DELIVERED'
    })
    .eq('id', orderId);

  alert("Delivered ✅");
  loadMyOrders();
}

// initial load
loadOrders();
</script>

</body>
</html>
