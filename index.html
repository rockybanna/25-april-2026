<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FoodXpress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }

    .restaurant {
      background: white;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
    }

    .closed {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="header">FoodXpress</div>

<div id="restaurants"></div>

<script>
const { createClient } = window.supabase;

const supabase = createClient(
  "https://rjkkasswxuzhaegocbim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2thc3N3eHV6aGFlZ29jYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE3OTIsImV4cCI6MjA5MjY3Nzc5Mn0.l08t44YE-ElP9pSXV6s1Z6qgktaNz8jboEjJ0cK_BCU"
);

async function loadRestaurants() {

  const { data, error } = await supabase
    .from('restaurants')
    .select('*');

  if (error) {
    console.log(error);
    return;
  }

  const container = document.getElementById("restaurants");
  container.innerHTML = "";

  data.forEach(r => {

    const div = document.createElement("div");
    div.className = "restaurant";

    div.innerHTML = `
      <h3>${r.name}</h3>
      ${r.is_online ? "" : "<div class='closed'>Closed</div>"}
    `;

    container.appendChild(div);
  });
}

loadRestaurants();
</script>

</body>
</html>
