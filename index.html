<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FoodXpress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }

    .restaurant {
      background: white;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
    }

    .closed {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="header">FoodXpress</div>

<div id="restaurants"></div>

<script>
const { createClient } = window.supabase;

const sb = createClient(
  "https://rjkkasswxuzhaegocbim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2thc3N3eHV6aGFlZ29jYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE3OTIsImV4cCI6MjA5MjY3Nzc5Mn0.l08t44YE-ElP9pSXV6s1Z6qgktaNz8jboEjJ0cK_BCU"
);

async function loadRestaurants() {

  const { data } = await sb
    .from('restaurants')
    .select('*');

  const container = document.getElementById("restaurants");
  container.innerHTML = "";

  data.forEach(r => {

    const div = document.createElement("div");
    div.className = "restaurant";

    div.innerHTML = `
      <h3>${r.name}</h3>
      ${r.is_online ? "" : "<div class='closed'>Closed</div>"}
    `;

    div.onclick = () => loadMenu(r.id, r.name);

    container.appendChild(div);
  });
}

async function loadMenu(restaurantId, name) {

  const { data } = await sb
    .from('menu_items')
    .select('*')
    .eq('restaurant_id', restaurantId);

  const container = document.getElementById("restaurants");
  container.innerHTML = `<h2 style="padding:10px">${name}</h2>`;

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "restaurant";

    div.innerHTML = `
      <h3>${item.name}</h3>
      <p>₹${item.restaurant_price}</p>
      <button onclick="showBill('${restaurantId}','${item.name}',${item.restaurant_price})">
        Order Now
      </button>
    `;

    container.appendChild(div);
  });
}
  function showBill(restaurantId, itemName, price) {

  const display_price = price * 1.25;
  const discount = display_price * 0.20;
  const final_price = price;

  const delivery = 40;
  const platform = 5;

  const total = final_price + delivery + platform;

  const container = document.getElementById("restaurants");

  container.innerHTML = `
    <div class="restaurant">
      <h2>Bill Summary</h2>

      <p>Item: ${itemName}</p>
      <p>Item Total: ₹${display_price.toFixed(0)}</p>
      <p>Discount: -₹${discount.toFixed(0)}</p>

      <p>Delivery: ₹${delivery}</p>
      <p>Platform Fee: ₹${platform}</p>

      <hr>

      <h3>To Pay: ₹${total}</h3>

      <button onclick="placeOrder('${restaurantId}','${itemName}',${price})">
        Confirm Order
      </button>

      <br><br>
      <button onclick="loadRestaurants()">Cancel</button>
    </div>
  `;
}
  
  async function placeOrder(restaurantId, itemName, price) {

  const restaurant_price = price;
  const display_price = price * 1.25;
  const discount = display_price * 0.20;
  const final_price = price;

  const commission = price * 0.10;
  const payout = price - commission;

  const { error } = await sb.from('orders').insert({
    restaurant_id: restaurantId,
    item_name: itemName,
    restaurant_price,
    display_price,
    discount,
    final_price,
    commission,
    payout,
    status: 'PENDING'
  });

  if (error) {
    alert("Error placing order");
    console.log(error);
  } else {
    alert("Order placed!");
  }
}
  
loadRestaurants();
</script>

</body>
</html>
