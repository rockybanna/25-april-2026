<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; background:#f5f5f5; margin:0; }
    .box {
      background:white;
      margin:10px;
      padding:20px;
      border-radius:10px;
      font-size:18px;
    }
  </style>

</head>

<body>

<h2 style="padding:10px">📊 Admin Dashboard</h2>

<div id="stats"></div>

<script>
const { createClient } = window.supabase;

const sb = createClient(
  "https://rjkkasswxuzhaegocbim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2thc3N3eHV6aGFlZ29jYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE3OTIsImV4cCI6MjA5MjY3Nzc5Mn0.l08t44YE-ElP9pSXV6s1Z6qgktaNz8jboEjJ0cK_BCU"
);

async function loadDashboard() {

  const { data } = await sb
    .from('orders')
    .select('*');

  let totalOrders = data.length;
  let totalRevenue = 0;
  let totalProfit = 0;
  let delivered = 0;
  let pending = 0;

  data.forEach(o => {

    totalRevenue += o.total_amount || 0;
    totalProfit += o.commission || 0;

    if (o.status === 'DELIVERED') delivered++;
    if (o.status !== 'DELIVERED') pending++;
  });

  const container = document.getElementById("stats");

  container.innerHTML = `
    <div class="box">Total Orders: ${totalOrders}</div>
    <div class="box">Total Revenue: ₹${totalRevenue}</div>
    <div class="box">Total Profit: ₹${totalProfit}</div>
    <div class="box">Delivered Orders: ${delivered}</div>
    <div class="box">Pending Orders: ${pending}</div>
  `;
}

loadDashboard();
</script>

</body>
</html>
