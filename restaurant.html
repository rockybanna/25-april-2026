<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Restaurant Panel</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; background:#f5f5f5; margin:0; }
    .card { background:white; margin:10px; padding:15px; border-radius:10px; }
    button { padding:10px; margin-top:10px; width:100%; }
  </style>

</head>

<body>

<h2 style="padding:10px">Restaurant Orders</h2>
<div id="list"></div>

<script>
const { createClient } = window.supabase;

const sb = createClient(
  "https://rjkkasswxuzhaegocbim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2thc3N3eHV6aGFlZ29jYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE3OTIsImV4cCI6MjA5MjY3Nzc5Mn0.l08t44YE-ElP9pSXV6s1Z6qgktaNz8jboEjJ0cK_BCU"
);

// 🔴 CHANGE THIS
const RESTAURANT_NAME = "Restaurant 1";

async function loadOrders() {

  const { data: rest } = await sb
    .from('restaurants')
    .select('id, name')
    .eq('name', RESTAURANT_NAME)
    .single();

  const { data } = await sb
    .from('orders')
    .select('id, item_name, restaurant_price, status, preparation_time')
    .eq('restaurant_id', rest.id)
    .in('status', ['PAID', 'ACCEPTED'])
    .order('created_at', { ascending: false });

  const container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(o => {

    const total = o.restaurant_price; // simple (1 qty)

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <p><b>Order ID:</b> ${o.id}</p>
      <p><b>Restaurant:</b> ${rest.name}</p>

      <p><b>Item:</b> ${o.item_name}</p>
      <p><b>Price:</b> ₹${o.restaurant_price}</p>
      <p><b>Total:</b> ₹${total}</p>

      <p><b>Prep Time:</b> ${o.preparation_time || '-'} min</p>

      ${o.status === 'PAID' ? `
        <button onclick="acceptOrder('${o.id}')">Accept</button>
        <button onclick="rejectOrder('${o.id}')">Reject</button>
      ` : ''}

      ${o.status === 'ACCEPTED' ? `
        <button onclick="markReady('${o.id}')">Mark Ready</button>
      ` : ''}
    `;

    container.appendChild(div);
  });
}

async function acceptOrder(orderId) {

  const time = prompt("Enter preparation time (minutes):");

  if (!time || isNaN(time)) {
    alert("Enter valid time");
    return;
  }

  await sb.from('orders')
    .update({
      status: 'ACCEPTED',
      preparation_time: parseInt(time),
      accepted_at: new Date()
    })
    .eq('id', orderId);

  alert("Order Accepted");
  loadOrders();
}

async function rejectOrder(orderId) {

  await sb.from('orders')
    .update({ status: 'REJECTED' })
    .eq('id', orderId);

  alert("Order Rejected");
  loadOrders();
}

async function markReady(orderId) {

  await sb.from('orders')
    .update({
      status: 'READY',
      ready_at: new Date()
    })
    .eq('id', orderId);

  alert("Order Ready");
  loadOrders();
}

loadOrders();
</script>

</body>
</html>
